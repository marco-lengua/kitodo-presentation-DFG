<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:kitodo="http://typo3.org/ns/Kitodo/Dlf/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:for each="{children}" as="child">
    <f:switch expression="{child.ITEM_STATE}">
        <f:case value="ACT">
            <li class="tx-dlf-toc-act">
        </f:case>
        <f:case value="CUR">
            <li class="tx-dlf-toc-cur">
        </f:case>
        <f:case value="ACTIFSUB">
            <li class="tx-dlf-toc-act tx-dlf-toc-ifsub">
        </f:case>
        <f:case value="CURIFSUB">
            <li class="tx-dlf-toc-cur tx-dlf-toc-ifsub">
        </f:case>
        <f:case value="IFSUB">
            <li class="tx-dlf-toc-no tx-dlf-toc-ifsub">
        </f:case>
        <f:defaultCase>
            <li class="tx-dlf-toc-no">
        </f:defaultCase>
    </f:switch>
    <f:form method="post" action="tocClick" controller="TableOfContents" name="tocClickForm" object="{tocClickForm}" addQueryString="untrusted">
        <f:if condition="{viewData.requestData.id}">
            <f:form.hidden property="id" value="{viewData.requestData.id}"/>
        </f:if>
        <f:if condition="{viewData.requestData.double}">
           <f:form.hidden property="double" value="{viewData.requestData.double}"/>
        </f:if>
        <label for="fname"><f:render partial="TableOfContents/Title" arguments="{child: child}"/></label>
        <f:if condition="{child.page}">
           <f:form.hidden property="page" value="{child.page}" id="fname"/>
        </f:if>
    </f:form>
    <f:if condition="{settings.basketButton} && {settings.targetBasket}">
        <span class="tx-dlf-basket-button">
                <f:link.action
                    pageUid="{settings.targetBasket}"
                    action="main"
                    controller="Basket"
                    additionalParams="{'tx_dlf[addToBasket]':'toc', 'tx_dlf[logId]':child.basketButton.logId, 'tx_dlf[startpage]':child.basketButton.startpage, 'tx_dlf_basket[action]':'add', 'tx_dlf_basket[controller]':'Basket'}"
                    addQueryString="untrusted">
                        <f:translate key="basket.addBasket" />
                </f:link.action>
        </span>
    </f:if>

    <f:if condition="{child._SUB_MENU} && ({child.ITEM_STATE} == 'IFSUB' || {child.ITEM_STATE} == 'ACTIFSUB' || {child.ITEM_STATE} == 'CURIFSUB')">
        <ul>
            <f:render partial="TableOfContents/Children" arguments="{children: child._SUB_MENU, viewData: viewData}"/>
        </ul>
    </f:if>
    </li>
</f:for>
