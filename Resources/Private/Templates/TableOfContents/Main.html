<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="tx-dlf-tableofcontents">
    <ul>
        <form id="clickForm" method="post" action="{f:uri.page()}" name="tocClickForm" object="{tocClickForm}" addQueryString="untrusted">
            <input type="hidden" name="tocClickForm[id]" value="{viewData.requestData.id}">
            <input type="hidden" name="tocClickForm[double]" value="{viewData.requestData.double}">
            <input type="hidden" name="tocClickForm[page]" id="formPageInput" value="{viewData.requestData.page}">  
        <f:render partial="TableOfContents/Children" arguments="{children: toc, viewData: viewData}"/>
        <script>
            document.addEventListener('click', function (evt) {
                const tocItem = evt.target.closest('.toc-entry');
                if (!tocItem) return;  
                evt.preventDefault();
                document.getElementById('formPageInput').value= tocItem.dataset.page;;
                document.getElementById('clickForm').submit();
            });
            </script>
    </form>
    </ul>
</div>
</html>
