services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Kitodo\Dlf\:
    resource: '../Classes/*'

  Kitodo\Dlf\Command\DbDocsCommand:
    tags:
      - name: console.command
        command: 'kitodo:dbdocs'
        description: 'Generate database rst file.'

  Kitodo\Dlf\Command\DeleteCommand:
    tags:
      - name: console.command
        command: 'kitodo:delete'
        description: 'Delete single document from database and Solr.'

  Kitodo\Dlf\Command\HarvestCommand:
    tags:
      - name: console.command
        command: 'kitodo:harvest'
        description: 'Harvest OAI-PMH contents into database and Solr.'

  Kitodo\Dlf\Command\IndexCommand:
    tags:
      - name: console.command
        command: 'kitodo:index'
        description: 'Index single document into database and Solr.'

  Kitodo\Dlf\Command\ReindexCommand:
    tags:
      - name: console.command
        command: 'kitodo:reindex'
        description: 'Reindex a collection into database and Solr.'

  Kitodo\Dlf\Command\OptimizeCommand:
    tags:
      - name: console.command
        command: 'kitodo:optimize'
        description: 'Sending the commit and/or optimize command to the index.'

  Kitodo\Dlf\Command\SuggestBuildCommand:
    tags:
      - name: console.command
        command: 'kitodo:suggestBuild'
        description: 'Sending the suggest.build=true command to the index.'

  Kitodo\Dlf\Common\TypoScriptHelper:
    public: true

  Kitodo\Dlf\Validation\DOMDocumentValidationStack:
    autowire: false

  Kitodo\Dlf\Validation\SaxonXslToSvrlValidator:
    autowire: false

  Kitodo\Dlf\Validation\XmlSchemesValidator:
    autowire: false
  # ── JwtTokenService ────────────────────────────────────────────────────────
  # The $hmacSecret constructor argument cannot be autowired (it is a plain
  # string, not a class). We inject it explicitly from the environment here.
  # The $ttlSeconds argument has a default of 900 (15 min) and does not need
  # to be listed unless you want a different value.
  Kitodo\Dlf\Service\JwtTokenService:
    public: true
    shared: true
    arguments:
      $hmacSecret: '%env(DLF_JWT_SECRET)%'
      # Uncomment and adjust if your use case requires a different TTL:
      # $ttlSeconds: 900

  # ── LendingManagerService ──────────────────────────────────────────────────
  # The $seatTtlSeconds argument defaults to 900 (matches the JWT TTL).
  # The repository and persistence manager are injected via inject* methods
  # because they are Extbase-managed objects.
  Kitodo\Dlf\Service\LendingManagerService:
    public: true
    shared: true
    # $seatTtlSeconds: 900

  # ── PolicyDecisionService ──────────────────────────────────────────────────
  # All three dependencies (repository, JWT service, lending manager) are
  # injected via inject* methods so TYPO3's Extbase DI resolver handles the
  # Extbase-specific wiring (repositories, persistence manager) correctly.
  Kitodo\Dlf\Service\PolicyDecisionService:
    public: true
    shared: true
